name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 本仓库是预构建的静态站点，index.html 已是成品，
      # 这里只做完整性校验，然后原样打包，不引入任何构建依赖。
      - name: Sanity check payload
        run: |
          set -e
          f=index.html
          test -s "$f" || { echo "::error::$f 缺失或为空"; exit 1; }
          grep -q '__DATA__' "$f" && { echo "::error::占位符未被替换，构建不完整"; exit 1; }
          grep -q 'application/json' "$f" || { echo "::error::未找到内联数据块"; exit 1; }
          # 确认没有意外残留的本地路径
          if grep -qE '[A-Za-z]:\\+Users|/home/[a-z]+' "$f"; then
            echo "::warning::检测到疑似本地路径，请人工确认"
          fi
          size=$(wc -c < "$f")
          echo "✅ index.html ${size} bytes"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
